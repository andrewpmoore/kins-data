name: Harvest hosted app data

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/harvest-hosted-data.yml"
      - "tools/data_harvest/**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: hosted-app-data
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh attributed Wiktionary name etymologies
        run: |
          if [ "$(date -u +%d)" != "01" ]; then exit 0; fi
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/kaikki-names.jsonl" \
            https://kaikki.org/dictionary/English/pos-name/kaikki.org-dictionary-English-by-pos-name.jsonl
          python tools/data_harvest/import_wiktionary_names.py \
            --input "${RUNNER_TEMP}/kaikki-names.jsonl" --max-entries 10000
      - name: Test importers and editorial data
        run: python -m unittest tools/data_harvest/test_harvest.py
      - name: Rebuild reviewed legacy archive
        run: python tools/data_harvest/import_legacy_data.py
      - name: Save previous feed health
        run: cp hosted-data/manifest.json "${RUNNER_TEMP}/previous-manifest.json"
      - name: Harvest today's snapshots
        env:
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
        run: python tools/data_harvest/harvest.py
      - name: Detect newly failing feeds
        id: feed_failures
        run: |
          python tools/data_harvest/check_new_feed_failures.py \
            --previous "${RUNNER_TEMP}/previous-manifest.json" \
            --current hosted-data/manifest.json
      - name: Commit refreshed public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hosted-data tools/data_harvest/wiktionary-name-meanings.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: harvest $(date -u +%F)"
          git push
      - name: Create an alert for newly failing feeds
        if: steps.feed_failures.outputs.count != '0'
        uses: actions/github-script@v7
        env:
          ALERT_DATE: ${{ steps.feed_failures.outputs.date }}
          ALERT_KEY: ${{ steps.feed_failures.outputs.alert_key }}
          ALERT_REPORT: ${{ steps.feed_failures.outputs.report }}
          ALERT_SOURCES: ${{ steps.feed_failures.outputs.sources }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `Data feed failure: ${process.env.ALERT_SOURCES} (${process.env.ALERT_DATE})`;
            const marker = `<!-- kins-feed-alert:${process.env.ALERT_KEY} -->`;
            const recent = await github.rest.issues.listForRepo({ owner, repo, state: 'all', per_page: 100 });
            if (!recent.data.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body: `${marker}\n${process.env.ALERT_REPORT}\n\n[Open the failed workflow run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`,
                assignees: [owner]
              });
            }
