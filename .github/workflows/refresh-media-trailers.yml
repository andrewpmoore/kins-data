name: Refresh movie and game trailer index

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hosted-app-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build trailer index from Wikidata and manual links
        run: >-
          python refresh_media_trailers.py
          --data-dir hosted-data
          --output hosted-data/media-trailers.json
          --manual-input tools/data_harvest/manual-media-trailers.json
      - name: Publish trailer index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hosted-data/media-trailers.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh media trailer index"
          git push
