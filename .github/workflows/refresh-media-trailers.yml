name: Refresh movie and game trailer index

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Refresh even if the index is less than seven days old
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: hosted-app-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Wikidata trailer index
        env:
          MAX_AGE_DAYS: ${{ github.event_name == 'schedule' && '7' || (inputs.force && '0' || '7') }}
        run: >-
          python refresh_media_trailers.py
          --data-dir hosted-data
          --output hosted-data/media-trailers.json
          --max-age-days "$MAX_AGE_DAYS"
      - name: Publish trailer index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hosted-data/media-trailers.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh media trailer index"
          git push
